<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ham Radio Callsign Lookup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Ham Radio Callsign Lookup</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" id="menu-reset">Reset</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="menu-download">Download CSV</a>
          </li>
          <li class="nav-item">
            <label class="nav-link" id="menu-import-label" style="cursor: pointer;">
              Import CSV
              <input type="file" id="menu-import" accept=".csv" style="display: none;">
            </label>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="menu-about">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="about-modal" class="modal hidden">
    <div class="modal-content">
      <h2>About</h2>
      <p>Ham Radio Callsign Lookup using QRZ.com API</p>
      <p><a href="https://github.com/payne/mc" target="_blank">https://github.com/payne/mc</a></p>
      <button id="about-close">Close</button>
    </div>
  </div>

  <main>
    <section class="input-section">
      <label for="callsign-input">Enter Callsigns (separated by spaces or commas):</label>
      <div class="input-row">
        <textarea id="callsign-input" placeholder="e.g., W1AW, K5D N0CALL" rows="3"></textarea>
        <button id="lookup-btn">Lookup</button>
      </div>
      <p id="status-message"></p>
      <div class="manual-add-row">
        <input type="text" id="manual-call" placeholder="Call" />
        <input type="text" id="manual-name" placeholder="Name" />
        <input type="text" id="manual-address" placeholder="Address" />
        <button id="manual-add-btn">Manually Add</button>
      </div>
    </section>

    <div class="content-wrapper">
      <section class="table-section">
        <div class="table-header">
          <h2>Callsign Results</h2>
          <input type="text" id="filter-input" placeholder="Filter..." />
          <input type="text" id="distance-from-input" placeholder="Distance from..." />
        </div>
        <table id="results-table">
          <thead>
            <tr>
              <th data-sort="callsign" class="sortable">Callsign</th>
              <th data-sort="name" class="sortable">Name</th>
              <th data-sort="address" class="sortable">Address</th>
              <th id="distance-header" data-sort="distance" class="sortable hidden">Distance</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="results-body">
          </tbody>
        </table>
        <p id="empty-message">No callsigns looked up yet. Enter a callsign above.</p>
      </section>

      <section class="map-section">
        <h2>Locations</h2>
        <div id="map"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
