<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ham Radio Callsign Lookup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header>
    <h1>Ham Radio Callsign Lookup</h1>
    <div class="menu-container">
      <button id="menu-btn" class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="menu" class="menu hidden" style="display:none">
        <button id="menu-reset">Reset</button>
        <button id="menu-download">Download CSV</button>
        <label id="menu-import-label">
          Import CSV
          <input type="file" id="menu-import" accept=".csv">
        </label>
        <button id="menu-about">About</button>
      </nav>
    </div>
  </header>

  <div id="about-modal" class="modal hidden">
    <div class="modal-content">
      <h2>About</h2>
      <p>Ham Radio Callsign Lookup using QRZ.com API</p>
      <p><a href="https://github.com/payne/mc" target="_blank">https://github.com/payne/mc</a></p>
      <button id="about-close">Close</button>
    </div>
  </div>

  <main>
    <section class="input-section">
      <label for="callsign-input">Enter Callsigns (separated by spaces or commas):</label>
      <div class="input-row">
        <textarea id="callsign-input" placeholder="e.g., W1AW, K5D N0CALL" rows="3"></textarea>
        <button id="lookup-btn">Lookup</button>
      </div>
      <p id="status-message"></p>
    </section>

    <div class="content-wrapper">
      <section class="table-section">
        <h2>Callsign Results</h2>
        <table id="results-table">
          <thead>
            <tr>
              <th>Callsign</th>
              <th>Name</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="results-body">
          </tbody>
        </table>
        <p id="empty-message">No callsigns looked up yet. Enter a callsign above.</p>
      </section>

      <section class="map-section">
        <h2>Locations</h2>
        <div id="map"></div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
